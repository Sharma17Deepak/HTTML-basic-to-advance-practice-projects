<html>
    <script>
        let globalId = 1;

        function markDone(todoId){
            const parent = document.getElementById(todoId);
            parent.children[2].innerHTML = "Done!";
        }

        function createChild(title,description,id){
            const child = document.createElement("div");
            const firstChild = document.createElement("div");
            firstChild.innerHTML = title;
            const secondChild = document.createElement("div");
            secondChild.innerHTML = description;
            const thirdChild = document.createElement("button");
            thirdChild.innerHTML = "Mark as done!";
            thirdChild.setAttribute("onclick" , `markDone(${id})`);
            child.appendChild(firstChild);
            child.appendChild(secondChild);
            child.appendChild(thirdChild);
            child.setAttribute("id",id);
            return child;
        }

        function calcSum(){
            const title = document.getElementById("title").value;
            const description = document.getElementById("desc").value;
            const parentDiv = document.getElementById("container");   
            parentDiv.appendChild(createChild(title,description,globalId++))   
        }
    </script>
    <body>
        <input id="title" type="text" placeholder="Enter a title"/> <br><br/>
        <input id="desc" type="text" placeholder="Enter description"/> <br><br/>
        <button onclick="calcSum()">Add todo</button> <br/>
        <div id="container"></div>
    </body>
</html>
